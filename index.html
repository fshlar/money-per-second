<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月薪计算器 - 每秒赚多少</title>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --bg-card: rgba(255, 255, 255, 0.1);
            --bg-card-solid: #2d2d44;
            --text-primary: #fff;
            --text-secondary: #a0a0a0;
            --accent-gold: #ffd700;
            --accent-gold-dark: #ffaa00;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(255, 215, 0, 0.2);
            --shadow-gold: rgba(74, 222, 128, 0.4);
            --shadow-orange: rgba(249, 115, 22, 0.4);
            --shadow-red: rgba(239, 68, 68, 0.4);
        }

        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #cbd5e1 100%);
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-solid: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #64748b;
            --accent-gold: #f59e0b;
            --accent-gold-dark: #d97706;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.05);
            --shadow-color: rgba(245, 158, 11, 0.2);
            --shadow-gold: rgba(34, 197, 94, 0.4);
            --shadow-orange: rgba(249, 115, 22, 0.4);
            --shadow-red: rgba(239, 68, 68, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            color: #111;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px #ffd700; }
            50% { box-shadow: 0 0 20px #ffd700, 0 0 30px #ff6b00; }
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-theme {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-theme:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .btn-mode {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-mode.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            border-color: transparent;
        }

        .btn-mode.slacking.active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            border-color: transparent;
        }

        .btn-share {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
        }

        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }

        .input-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: var(--input-bg);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .display-card {
            background: var(--bg-card-solid);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 40px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .display-card.vip-active {
            border: 2px solid rgba(255, 107, 0, 0.6);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.3);
        }

        .earnings-label {
            font-size: 0.9rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .earnings-amount {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-shadow: 0 0 30px var(--shadow-color);
            transition: transform 0.1s ease;
            font-variant-numeric: tabular-nums;
        }

        .earnings-amount.pulse {
            transform: scale(1.08);
        }

        .per-second {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 15px;
        }

        .per-second span {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-gold);
        }

        .btn-pause {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-orange);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-red);
        }

        .btn:active {
            transform: translateY(0);
        }

        .premium-section {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .premium-section.hidden {
            display: none;
        }

        .premium-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffd700;
        }

        [data-theme="light"] .premium-card {
            background: #fff5e6;
        }

        .premium-card h3 {
            color: #ffd700;
            margin: 0 0 15px 0;
        }

        .premium-features {
            color: #eee;
            text-align: left;
            margin: 15px auto;
            max-width: 300px;
            line-height: 1.8;
            list-style: none;
            padding: 0;
        }

        [data-theme="light"] .premium-features {
            color: #333;
        }

        .premium-features li {
            margin-bottom: 8px;
        }

        .btn-unlock {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #111;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.5);
        }

        .premium-note {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-card-solid);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 2px solid var(--accent-gold);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            color: var(--accent-gold);
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
        }

        .btn-cancel {
            background: #666;
            color: #fff;
        }

        .coin-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .coin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(255, 215, 0, 0.5);
            animation: coinFall 1.5s ease-in forwards;
        }

        .coin.critical {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ff6347);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.5);
        }

        .coin::after {
            content: '¥';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #b8860b;
        }

        .coin.critical::after {
            font-size: 20px;
        }

        @keyframes coinFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg) scale(0.5);
            }
        }

        @keyframes coinBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1.5) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(360deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(var(--tx) * 3), calc(var(--ty) * 3 + 200px)) scale(0.3) rotate(720deg);
            }
        }

        .coin.critical {
            animation: coinBurst 1s ease-out forwards;
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 0.8s ease-out forwards;
        }

        @keyframes sparkle {
            0% {
                opacity: 1;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes criticalText {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(0);
            }
            20% {
                opacity: 1;
                transform: scale(1.2) translateY(-20px);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-80px);
            }
        }

        .critical-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 700;
            color: #ff6347;
            text-shadow: 0 0 10px rgba(255, 99, 71, 0.8), 0 0 20px rgba(255, 99, 71, 0.5);
            animation: criticalText 1s ease-out forwards;
            pointer-events: none;
            z-index: 1001;
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--fx), var(--fy)) scale(0.3);
            }
        }

        .running-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        .running-indicator.paused {
            background: #f97316;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 10px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
        }

        .mode-badge.slacking {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .share-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .share-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.6rem;
            }

            .earnings-amount {
                font-size: 2.2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-wrap: wrap;
            }

            .btn {
                flex: 1 1 calc(50% - 5px);
            }

            .toolbar {
                gap: 8px;
            }

            .toolbar-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="coin-container" id="coinContainer"></div>
    <div class="share-toast" id="shareToast">已复制到剪贴板！</div>

    <div class="modal-overlay" id="unlockModal">
        <div class="modal">
            <h2>✨ 解锁高级版</h2>
            <input type="text" class="modal-input" id="codeInput" placeholder="请输入解锁码">
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" id="cancelBtn">取消</button>
                <button class="btn-modal btn-confirm" id="confirmBtn">确认</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>💰 月薪计算器 <span class="vip-badge hidden" id="vipBadge">✨ VIP</span></h1>
            <p>看看你每秒能赚多少钱</p>
        </div>

        <div class="toolbar">
            <button class="toolbar-btn btn-theme" id="themeBtn">🌙 暗黑</button>
            <button class="toolbar-btn btn-mode" id="modeBtn">💼 打工模式</button>
            <button class="toolbar-btn btn-share" id="shareBtn">📸 截图分享</button>
        </div>

        <div class="input-card">
            <div class="input-group">
                <label>月薪金额 (元)</label>
                <input type="number" id="monthlySalary" placeholder="请输入月薪" value="15000">
            </div>
            <div class="input-group">
                <label>每月工作天数</label>
                <input type="number" id="workDays" placeholder="请输入工作天数" value="22">
            </div>
            <div class="input-group">
                <label>每日工作小时数</label>
                <input type="number" id="workHours" placeholder="请输入每日工作小时" value="8">
            </div>
        </div>

        <div class="display-card" id="displayCard">
            <div class="earnings-label">
                <span class="running-indicator" id="runningIndicator"></span>
                当前总收益
                <span class="mode-badge" id="modeBadge">打工</span>
            </div>
            <div class="earnings-amount" id="totalEarnings">¥0.00</div>
            <div class="per-second">
                每秒收入 <span id="perSecond">¥0.00</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">今日已赚</div>
                <div class="value" id="todayEarnings">¥0.00</div>
            </div>
            <div class="stat-card">
                <div class="label">工作时长</div>
                <div class="value" id="workTime">0时0分0秒</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn">开始</button>
            <button class="btn btn-pause" id="pauseBtn">暂停</button>
            <button class="btn btn-reset" id="resetBtn">重置</button>
        </div>

        <div class="premium-section" id="premiumSection">
            <div class="premium-card">
                <h3>打工人专属「搞钱buff」已上线！</h3>
                <ul class="premium-features">
                    <li>✅ 金币暴击+烟花特效，每一秒都在爽</li>
                    <li>✅ 自定义工作时长，精准算清你的「摸鱼成本」</li>
                    <li>✅ 无广告纯净模式，沉浸式体验搞钱快乐</li>
                    <li>✅ 专属打工人音效，进账即放「恭喜发财」</li>
                </ul>
                <button class="btn-unlock" id="unlockBtn">👉 19.9元解锁，爽一整年</button>
                <p class="premium-note">付完款截图发给我，直接给你开通权限 ✨</p>
            </div>
        </div>
    </div>

    <script>
        const monthlySalaryInput = document.getElementById('monthlySalary');
        const workDaysInput = document.getElementById('workDays');
        const workHoursInput = document.getElementById('workHours');
        const totalEarningsEl = document.getElementById('totalEarnings');
        const perSecondEl = document.getElementById('perSecond');
        const todayEarningsEl = document.getElementById('todayEarnings');
        const workTimeEl = document.getElementById('workTime');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const runningIndicator = document.getElementById('runningIndicator');
        const coinContainer = document.getElementById('coinContainer');
        const themeBtn = document.getElementById('themeBtn');
        const modeBtn = document.getElementById('modeBtn');
        const modeBadge = document.getElementById('modeBadge');
        const shareBtn = document.getElementById('shareBtn');
        const shareToast = document.getElementById('shareToast');
        const displayCard = document.getElementById('displayCard');
        const premiumSection = document.getElementById('premiumSection');
        const unlockBtn = document.getElementById('unlockBtn');
        const unlockModal = document.getElementById('unlockModal');
        const codeInput = document.getElementById('codeInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const vipBadge = document.getElementById('vipBadge');

        let isRunning = false;
        let totalEarnings = 0;
        let earningsPerSecond = 0;
        let startTime = null;
        let pausedTime = 0;
        let lastUpdate = null;
        let animationFrameId = null;
        let lastCoinTime = 0;
        let isSlacking = false;
        let isDarkTheme = true;
        let criticalCombo = 0;
        let lastCriticalTime = 0;
        let isVip = false;
        const VIP_CODE = 'VIP2026';

        function init() {
            checkVipStatus();
            calculateEarnings();
            runningIndicator.classList.add('paused');
        }

        function checkVipStatus() {
            const saved = localStorage.getItem('vipUnlocked');
            if (saved === 'true') {
                activateVip();
            }
        }

        function activateVip() {
            isVip = true;
            premiumSection.classList.add('hidden');
            vipBadge.classList.remove('hidden');
            displayCard.classList.add('vip-active');
            localStorage.setItem('vipUnlocked', 'true');
        }

        function deactivateVip() {
            isVip = false;
            premiumSection.classList.remove('hidden');
            vipBadge.classList.add('hidden');
            displayCard.classList.remove('vip-active');
            localStorage.removeItem('vipUnlocked');
        }

        function showModal() {
            unlockModal.classList.add('active');
            codeInput.value = '';
            codeInput.focus();
        }

        function hideModal() {
            unlockModal.classList.remove('active');
        }

        function verifyCode() {
            const code = codeInput.value.trim().toUpperCase();
            if (code === VIP_CODE) {
                activateVip();
                hideModal();
                shareToast.textContent = '🎉 VIP已激活！享受高级特效吧！';
                shareToast.classList.add('show');
                setTimeout(() => shareToast.classList.remove('show'), 2500);
                triggerCelebration();
            } else {
                shareToast.textContent = '❌ 解锁码错误，请重试';
                shareToast.classList.add('show');
                setTimeout(() => shareToast.classList.remove('show'), 2000);
            }
        }

        function triggerCelebration() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight * 0.3 + Math.random() * window.innerHeight * 0.3;
                    createFirework(x, y);
                }, i * 100);
            }
        }

        function calculateEarnings() {
            const salary = parseFloat(monthlySalaryInput.value) || 0;
            const days = parseFloat(workDaysInput.value) || 1;
            const hours = parseFloat(workHoursInput.value) || 1;

            const totalSeconds = days * hours * 3600;
            earningsPerSecond = salary / totalSeconds;

            if (isSlacking) {
                earningsPerSecond *= 0.5;
            }

            perSecondEl.textContent = '¥' + earningsPerSecond.toFixed(4);
        }

        function formatMoney(amount) {
            if (amount >= 10000) {
                return '¥' + amount.toFixed(2);
            } else if (amount >= 100) {
                return '¥' + amount.toFixed(2);
            } else if (amount >= 1) {
                return '¥' + amount.toFixed(2);
            } else {
                return '¥' + amount.toFixed(4);
            }
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${hours}时${minutes}分${secs}秒`;
        }

        function createCoin(x, y, isCritical = false) {
            const coin = document.createElement('div');
            coin.className = 'coin' + (isCritical ? ' critical' : '');
            coin.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
            coin.style.top = y + 'px';

            if (isCritical) {
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200 - 100;
                coin.style.setProperty('--tx', tx + 'px');
                coin.style.setProperty('--ty', ty + 'px');
            }

            coinContainer.appendChild(coin);

            setTimeout(() => {
                coin.remove();
            }, isCritical ? 1000 : 1500);
        }

        function createSparkle(x, y) {
            const count = isVip ? 10 : 5;
            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                sparkle.style.top = (y + (Math.random() - 0.5) * 100) + 'px';
                sparkle.style.width = (5 + Math.random() * 15) + 'px';
                sparkle.style.height = sparkle.style.width;
                const colors = ['#ffd700', '#ff6b00', '#ff0066', '#00ff99'];
                sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
                coinContainer.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        }

        function createCriticalText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'critical-text';
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            coinContainer.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 1000);
        }

        function createFirework(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffd700'];
            const particleCount = isVip ? 40 : 20;
            const radius = isVip ? 150 : 80;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 6px ${particle.style.background}`;

                const angle = (i / particleCount) * Math.PI * 2;
                const dist = radius * (0.5 + Math.random() * 0.5);
                const fx = Math.cos(angle) * dist;
                const fy = Math.sin(angle) * dist;
                particle.style.setProperty('--fx', fx + 'px');
                particle.style.setProperty('--fy', fy + 'px');
                particle.style.animation = `firework ${1 + Math.random()}s ease-out forwards`;

                coinContainer.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        }

        function spawnCoins() {
            const now = Date.now();
            const displayRect = displayCard.getBoundingClientRect();
            const x = displayRect.left + displayRect.width / 2;
            const y = displayRect.top + displayRect.height / 2;

            const interval = isVip ? (isSlacking ? 500 : 200) : (isSlacking ? 800 : 300);
            if (now - lastCoinTime > interval) {
                const coinCount = isVip ? 2 : 1;
                for (let i = 0; i < coinCount; i++) {
                    createCoin(x, y);
                }
                if (Math.random() < 0.4) {
                    createSparkle(x, y);
                }
                lastCoinTime = now;
            }
        }

        function triggerCriticalHit() {
            const now = Date.now();
            if (now - lastCriticalTime > 3000) {
                criticalCombo = 0;
            }
            criticalCombo++;
            lastCriticalTime = now;

            const displayRect = displayCard.getBoundingClientRect();
            const x = displayRect.left + displayRect.width / 2;
            const y = displayRect.top + displayRect.height / 2;

            const baseCount = isVip ? 10 : 5;
            const coinCount = Math.min(baseCount + criticalCombo * 3, isVip ? 30 : 20);
            for (let i = 0; i < coinCount; i++) {
                setTimeout(() => {
                    createCoin(
                        x + (Math.random() - 0.5) * 200,
                        y + (Math.random() - 0.5) * 100,
                        true
                    );
                }, i * 30);
            }

            createSparkle(x, y);

            if (isVip) {
                createFirework(x, y);
            }

            let critText = '💥 暴击!';
            if (criticalCombo >= 3) critText = '🔥 连击 x' + criticalCombo + '!';
            if (criticalCombo >= 5) critText = '⭐ 超必杀 x' + criticalCombo + '!';
            if (criticalCombo >= 8) critText = '🏆 传说暴击 x' + criticalCombo + '!';
            createCriticalText(x - 70, y - 50, critText);

            totalEarningsEl.style.transform = 'scale(1.25)';
            setTimeout(() => {
                totalEarningsEl.style.transform = 'scale(1)';
            }, 200);
        }

        function update(currentTime) {
            if (!isRunning) return;

            if (!lastUpdate) {
                lastUpdate = currentTime;
                startTime = currentTime - pausedTime * 1000;
            }

            const elapsed = (currentTime - startTime) / 1000;
            const previousEarnings = totalEarnings;
            totalEarnings = elapsed * earningsPerSecond;
            pausedTime = elapsed;

            const earningsDiff = totalEarnings - previousEarnings;

            const critChance = isVip ? (isSlacking ? 0.02 : 0.015) : (isSlacking ? 0.01 : 0.005);
            if (Math.random() < critChance) {
                triggerCriticalHit();
            }

            if (earningsDiff > earningsPerSecond * 0.5) {
                spawnCoins();
            }

            totalEarningsEl.textContent = formatMoney(totalEarnings);
            todayEarningsEl.textContent = formatMoney(totalEarnings);

            const currentElapsed = (currentTime - startTime) / 1000;
            workTimeEl.textContent = formatTime(currentElapsed);

            totalEarningsEl.classList.add('pulse');
            setTimeout(() => {
                totalEarningsEl.classList.remove('pulse');
            }, 50);

            animationFrameId = requestAnimationFrame(update);
        }

        function start() {
            if (isRunning) return;

            calculateEarnings();

            if (earningsPerSecond <= 0) {
                alert('请输入有效的薪资数据');
                return;
            }

            isRunning = true;
            lastUpdate = null;
            runningIndicator.classList.remove('paused');
            animationFrameId = requestAnimationFrame(update);
        }

        function pause() {
            isRunning = false;
            runningIndicator.classList.add('paused');
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }

        function reset() {
            pause();
            totalEarnings = 0;
            pausedTime = 0;
            startTime = null;
            lastUpdate = null;
            lastCoinTime = 0;
            criticalCombo = 0;

            totalEarningsEl.textContent = '¥0.00';
            todayEarningsEl.textContent = '¥0.00';
            workTimeEl.textContent = '0时0分0秒';
            runningIndicator.classList.add('paused');
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.body.setAttribute('data-theme', isDarkTheme ? 'dark' : 'light');
            themeBtn.textContent = isDarkTheme ? '🌙 暗黑' : '☀️ 明亮';
        }

        function toggleMode() {
            isSlacking = !isSlacking;
            modeBtn.textContent = isSlacking ? '🐟 摸鱼模式' : '💼 打工模式';
            modeBtn.classList.toggle('slacking', isSlacking);
            modeBadge.textContent = isSlacking ? '摸鱼' : '打工';
            modeBadge.classList.toggle('slacking', isSlacking);

            if (!isRunning) {
                calculateEarnings();
            }
        }

        async function shareScreen() {
            try {
                const text = `💰 我的月薪计算器\n月薪: ¥${monthlySalaryInput.value}\n每秒: ${perSecondEl.textContent}\n已赚: ${totalEarningsEl.textContent}\n\n摸鱼必备 | 月薪计算器`;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                }

                shareToast.textContent = '已复制到剪贴板！';
                shareToast.classList.add('show');
                setTimeout(() => {
                    shareToast.classList.remove('show');
                }, 2000);
            } catch (err) {
                shareToast.textContent = '复制失败';
                shareToast.classList.add('show');
                setTimeout(() => {
                    shareToast.classList.remove('show');
                }, 2000);
            }
        }

        monthlySalaryInput.addEventListener('input', () => {
            if (!isRunning) {
                calculateEarnings();
            }
        });

        workDaysInput.addEventListener('input', () => {
            if (!isRunning) {
                calculateEarnings();
            }
        });

        workHoursInput.addEventListener('input', () => {
            if (!isRunning) {
                calculateEarnings();
            }
        });

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);
        themeBtn.addEventListener('click', toggleTheme);
        modeBtn.addEventListener('click', toggleMode);
        shareBtn.addEventListener('click', shareScreen);
        unlockBtn.addEventListener('click', showModal);
        confirmBtn.addEventListener('click', verifyCode);
        cancelBtn.addEventListener('click', hideModal);
        unlockModal.addEventListener('click', (e) => {
            if (e.target === unlockModal) hideModal();
        });
        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyCode();
        });

        init();
    </script>
</body>
</html>
